[package]
name = "cordis-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Core of the cordis-rs framework — Fiber, Context, Events, Registry, Reflect, Logger"
license = "MIT"
homepage = "https://github.com/Ricardo-M-L/cordis-rs"
repository = "https://github.com/Ricardo-M-L/cordis-rs"
readme = "../README.md"
keywords = ["cordis", "framework", "fiber", "events", "logger"]
categories = ["asynchronous", "web-programming", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
cordis-timer = { path = "../cordis-timer" }
cordis-logger-console = { path = "../cordis-logger-console" }
cordis-utils = { path = "../cordis-utils" }
cordis-group = { path = "../cordis-group" }
cordis-include = { path = "../cordis-include" }
cordis-loader = { path = "../cordis-loader" }
cordis-hmr = { path = "../cordis-hmr" }
cordis-create = { path = "../cordis-create" }
