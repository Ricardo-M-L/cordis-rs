[package]
name = "cordis-create"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "CLI scaffolding tool for new cordis-rs projects"
license = "MIT"
homepage = "https://github.com/Ricardo-M-L/cordis-rs"
repository = "https://github.com/Ricardo-M-L/cordis-rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
