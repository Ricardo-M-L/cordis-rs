[package]
name = "cordis-loader"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Module loader for cordis-rs — Entry, Group, ModuleLoader"
license = "MIT"
homepage = "https://github.com/Ricardo-M-L/cordis-rs"
repository = "https://github.com/Ricardo-M-L/cordis-rs"

[dependencies]
cordis-core = { version = "0.1.0", path = "../cordis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
