[package]
name = "cordis-logger-console"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "ANSI-colored console log exporter for cordis-rs"
license = "MIT"
homepage = "https://github.com/Ricardo-M-L/cordis-rs"
repository = "https://github.com/Ricardo-M-L/cordis-rs"

[dependencies]
cordis-core = { version = "0.1.0", path = "../cordis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
